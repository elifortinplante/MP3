<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      viewport-fit=cover">

<title>Vidéo → MP3</title>

<!-- ZIP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    background: #f5f5f7;
    color: #111;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        Arial,
        sans-serif;
}

body {
    padding:
        max(20px, env(safe-area-inset-top))
        18px
        max(25px, env(safe-area-inset-bottom))
        18px;
}

.app {
    max-width: 650px;
    margin: auto;
}

/* HEADER */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
}

.title {
    margin: 0;
    font-size: 29px;
    font-weight: 750;
    letter-spacing: -0.7px;
}

.subtitle {
    color: #777;
    font-size: 14px;
    margin-top: 4px;
}

.add-button {
    width: 52px;
    height: 52px;
    border: none;
    border-radius: 17px;
    background: #111;
    color: white;
    font-size: 28px;
}

/* ADD AREA */

.add-area {
    background: white;
    border: 2px dashed #d5d5d8;
    border-radius: 22px;
    padding: 23px;
    text-align: center;
    margin-bottom: 20px;
}

.add-icon {
    font-size: 38px;
}

.add-title {
    font-size: 18px;
    font-weight: 700;
    margin-top: 5px;
}

.add-text {
    color: #777;
    font-size: 14px;
    margin-top: 5px;
}

/* LIST */

.list-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.list-title {
    font-size: 19px;
    font-weight: 700;
}

.counter {
    background: #e5e5e8;
    padding: 5px 11px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 650;
}

.video-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

/* CARD */

.video-card {
    background: white;
    border-radius: 20px;
    padding: 15px;
}

.video-top {
    display: flex;
    align-items: center;
    gap: 12px;
}

.video-icon {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    background: #f0f0f2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
}

.video-info {
    flex: 1;
    min-width: 0;
    padding-right: 35px;
}

.video-name {
    font-size: 15px;
    font-weight: 650;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.video-size {
    color: #888;
    font-size: 13px;
    margin-top: 3px;
}

.remove-button {
    float: right;
    margin-top: -39px;
    width: 35px;
    height: 35px;
    border: none;
    border-radius: 12px;
    background: #f0f0f2;
    font-size: 17px;
}

.remove-button:disabled {
    opacity: .3;
}

/* PROGRESS */

.progress-container {
    height: 7px;
    background: #e8e8ea;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 13px;
}

.progress {
    width: 0%;
    height: 100%;
    background: #111;
    transition: width .15s linear;
}

.status {
    margin-top: 9px;
    font-size: 13px;
    color: #777;
}

.status.processing {
    color: #111;
}

.status.success {
    color: #198754;
}

.status.error {
    color: #c62828;
}

/* BUTTONS */

button {
    font-family: inherit;
    cursor: pointer;
    touch-action: manipulation;
}

.main-button,
.secondary-button {
    width: 100%;
    min-height: 55px;
    border-radius: 18px;
    font-size: 16px;
    font-weight: 650;
    margin-top: 11px;
}

.main-button {
    background: #111;
    color: white;
    border: none;
}

.secondary-button {
    background: white;
    color: #111;
    border: 1px solid #ddd;
}

button:disabled {
    opacity: .35;
}

.hidden {
    display: none !important;
}

.zip-status {
    text-align: center;
    color: #777;
    font-size: 14px;
    margin-top: 12px;
}

/* LOADING */

.loading {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(245,245,247,.94);
    backdrop-filter: blur(12px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.loading.show {
    display: flex;
}

.loading-card {
    width: 100%;
    max-width: 400px;
    background: white;
    border-radius: 25px;
    padding: 28px;
    text-align: center;
}

.spinner {
    width: 40px;
    height: 40px;
    border: 4px solid #ddd;
    border-top-color: #111;
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin: auto auto 18px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.loading-title {
    font-size: 18px;
    font-weight: 700;
}

.loading-text {
    color: #777;
    font-size: 14px;
    line-height: 1.45;
    margin-top: 8px;
}

.loading-error {
    color: #c62828;
    margin-top: 15px;
    font-size: 14px;
}

.loading-close {
    display: none;
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 15px;
    background: #111;
    color: white;
    margin-top: 18px;
    font-weight: 650;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">

        <div>
            <h1 class="title">🎵 Vidéo → MP3</h1>

            <div class="subtitle">
                Convertis tes vidéos en MP3
            </div>
        </div>

        <button
            class="add-button"
            id="addButton">
            +
        </button>

    </div>


    <input
        id="fileInput"
        class="hidden"
        type="file"
        accept="video/*,.mp4,.mov,.m4v,.webm,.avi,.mkv"
        multiple>


    <div
        class="add-area"
        id="addArea">

        <div class="add-icon">📁</div>

        <div class="add-title">
            Ajouter des vidéos
        </div>

        <div class="add-text">
            Choisis une ou plusieurs vidéos
        </div>

    </div>


    <div class="list-header">

        <div class="list-title">
            Vidéos sélectionnées
        </div>

        <div
            class="counter"
            id="counter">
            0
        </div>

    </div>


    <div
        class="video-list"
        id="videoList">
    </div>


    <button
        class="main-button"
        id="convertButton"
        disabled>
        🎵 Convertir en MP3
    </button>


    <button
        class="secondary-button"
        id="zipButton"
        disabled>
        📦 Créer le ZIP
    </button>


    <button
        class="secondary-button"
        id="saveButton"
        disabled>
        💾 Enregistrer dans Fichiers
    </button>


    <div
        class="zip-status"
        id="zipStatus">
    </div>

</div>


<!-- CHARGEMENT -->

<div
    class="loading"
    id="loading">

    <div class="loading-card">

        <div
            class="spinner"
            id="spinner">
        </div>

        <div
            class="loading-title"
            id="loadingTitle">
            Chargement du moteur
        </div>

        <div
            class="loading-text"
            id="loadingText">
            Préparation du convertisseur MP3...
        </div>

        <div
            class="loading-error"
            id="loadingError">
        </div>

        <button
            class="loading-close"
            id="loadingClose">
            Fermer
        </button>

    </div>

</div>


<script>

/* =========================================================
   VARIABLES
========================================================= */

const fileInput =
    document.getElementById("fileInput");

const addButton =
    document.getElementById("addButton");

const addArea =
    document.getElementById("addArea");

const videoList =
    document.getElementById("videoList");

const counter =
    document.getElementById("counter");

const convertButton =
    document.getElementById("convertButton");

const zipButton =
    document.getElementById("zipButton");

const saveButton =
    document.getElementById("saveButton");

const zipStatus =
    document.getElementById("zipStatus");

const loading =
    document.getElementById("loading");

const loadingTitle =
    document.getElementById("loadingTitle");

const loadingText =
    document.getElementById("loadingText");

const loadingError =
    document.getElementById("loadingError");

const loadingClose =
    document.getElementById("loadingClose");

const spinner =
    document.getElementById("spinner");


let videos = [];

let ffmpeg = null;

let ffmpegLoaded = false;

let currentVideo = null;

let zipBlob = null;


/* =========================================================
   OUVRIR FICHIERS
========================================================= */

function openFiles() {
    fileInput.click();
}

addButton.addEventListener(
    "click",
    openFiles
);

addArea.addEventListener(
    "click",
    openFiles
);


/* =========================================================
   AJOUT
========================================================= */

fileInput.addEventListener(
    "change",
    function () {

        const files =
            Array.from(fileInput.files);

        for (const file of files) {

            const isVideo =
                file.type.startsWith("video/") ||
                /\.(mp4|mov|m4v|webm|avi|mkv)$/i
                    .test(file.name);

            if (!isVideo) {
                continue;
            }

            const duplicate =
                videos.some(v =>
                    v.file.name === file.name &&
                    v.file.size === file.size &&
                    v.file.lastModified ===
                        file.lastModified
                );

            if (duplicate) {
                continue;
            }

            videos.push({

                id:
                    Date.now() +
                    "_" +
                    Math.random()
                        .toString(36)
                        .substring(2),

                file,

                progress: 0,

                status: "waiting",

                mp3: null,

                outputName:
                    getMP3Name(file.name)

            });

        }

        fileInput.value = "";

        zipBlob = null;

        zipStatus.textContent = "";

        render();

        updateButtons();

    }
);


/* =========================================================
   RENDU
========================================================= */

function render() {

    videoList.innerHTML = "";

    counter.textContent =
        videos.length;

    for (const video of videos) {

        const card =
            document.createElement("div");

        card.className =
            "video-card";

        card.dataset.id =
            video.id;

        card.innerHTML = `

            <div class="video-top">

                <div class="video-icon">
                    🎬
                </div>

                <div class="video-info">

                    <div class="video-name">
                        ${escapeHTML(video.file.name)}
                    </div>

                    <div class="video-size">
                        ${formatBytes(video.file.size)}
                    </div>

                </div>

            </div>

            <button
                class="remove-button">
                🗑️
            </button>

            <div class="progress-container">

                <div
                    class="progress"
                    style="width:${video.progress}%">
                </div>

            </div>

            <div
                class="status ${statusClass(video.status)}">

                ${statusText(video)}

            </div>
        `;


        const remove =
            card.querySelector(
                ".remove-button"
            );

        if (video.status === "processing") {
            remove.disabled = true;
        }

        remove.addEventListener(
            "click",
            function () {

                if (
                    video.status ===
                    "processing"
                ) {
                    return;
                }

                videos =
                    videos.filter(
                        v =>
                            v.id !==
                            video.id
                    );

                zipBlob = null;

                zipStatus.textContent =
                    "";

                render();

                updateButtons();

            }
        );


        videoList.appendChild(card);

    }

}


/* =========================================================
   STATUS
========================================================= */

function statusText(video) {

    if (
        video.status ===
        "waiting"
    ) {
        return "En attente";
    }

    if (
        video.status ===
        "processing"
    ) {
        return (
            "Conversion : " +
            Math.round(
                video.progress
            ) +
            " %"
        );
    }

    if (
        video.status ===
        "done"
    ) {
        return "✓ MP3 terminé";
    }

    if (
        video.status ===
        "error"
    ) {
        return "⚠️ Erreur";
    }

    return "";

}


function statusClass(status) {

    if (status === "processing") {
        return "processing";
    }

    if (status === "done") {
        return "success";
    }

    if (status === "error") {
        return "error";
    }

    return "";

}


/* =========================================================
   UPDATE CARD
========================================================= */

function updateCard(video) {

    const card =
        videoList.querySelector(
            `[data-id="${video.id}"]`
        );

    if (!card) {
        return;
    }

    const progress =
        card.querySelector(
            ".progress"
        );

    const status =
        card.querySelector(
            ".status"
        );

    progress.style.width =
        video.progress + "%";

    status.className =
        "status " +
        statusClass(
            video.status
        );

    status.textContent =
        statusText(video);

}


/* =========================================================
   BOUTONS
========================================================= */

function updateButtons() {

    const hasVideos =
        videos.length > 0;

    const waiting =
        videos.some(
            v =>
                v.status ===
                "waiting"
        );

    const processing =
        videos.some(
            v =>
                v.status ===
                "processing"
        );

    const allDone =
        hasVideos &&
        videos.every(
            v =>
                v.status ===
                "done"
        );

    convertButton.disabled =
        !hasVideos ||
        !waiting ||
        processing;

    zipButton.disabled =
        !allDone;

    saveButton.disabled =
        !zipBlob;

}


/* =========================================================
   CHARGEMENT DE FFMPEG
========================================================= */

function loadScript(url) {

    return new Promise(
        (resolve, reject) => {

            const script =
                document.createElement(
                    "script"
                );

            script.src = url;

            script.async = true;

            script.onload =
                resolve;

            script.onerror =
                () =>
                    reject(
                        new Error(
                            "Impossible de charger : " +
                            url
                        )
                    );

            document.head.appendChild(
                script
            );

        }
    );

}


async function loadFFmpeg() {

    if (ffmpegLoaded) {
        return;
    }

    loading.classList.add("show");

    loadingError.textContent = "";

    loadingClose.style.display =
        "none";

    spinner.style.display =
        "block";

    loadingTitle.textContent =
        "Chargement du moteur";

    loadingText.textContent =
        "Téléchargement de FFmpeg. " +
        "Cela peut prendre un peu de temps " +
        "la première fois.";


    try {

        /*
           Charge FFmpeg depuis jsDelivr.
        */

        if (
            typeof FFmpeg ===
            "undefined"
        ) {

            await loadScript(
                "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"
            );

        }


        if (
            typeof FFmpegUtil ===
            "undefined"
        ) {

            await loadScript(
                "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"
            );

        }


        if (
            typeof FFmpeg ===
            "undefined"
        ) {
            throw new Error(
                "FFmpeg n'a pas été chargé."
            );
        }


        const {
            FFmpeg: FFmpegClass
        } = FFmpeg;

        const {
            toBlobURL
        } = FFmpegUtil;


        ffmpeg =
            new FFmpegClass();


        /*
           Progression FFmpeg.
        */

        ffmpeg.on(
            "progress",
            ({ progress }) => {

                if (
                    !currentVideo
                ) {
                    return;
                }

                currentVideo.progress =
                    Math.max(
                        0,
                        Math.min(
                            100,
                            progress * 100
                        )
                    );

                updateCard(
                    currentVideo
                );

            }
        );


        /*
           Version SINGLE THREAD.

           Elle est volontairement utilisée
           pour être plus simple sur iPhone.
        */

        const baseURL =
            "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd";


        loadingText.textContent =
            "Préparation du moteur FFmpeg...";


        await Promise.race([

            ffmpeg.load({

                coreURL:
                    await toBlobURL(
                        `${baseURL}/ffmpeg-core.js`,
                        "text/javascript"
                    ),

                wasmURL:
                    await toBlobURL(
                        `${baseURL}/ffmpeg-core.wasm`,
                        "application/wasm"
                    )

            }),

            new Promise(
                (_, reject) =>
                    setTimeout(
                        () =>
                            reject(
                                new Error(
                                    "Le chargement de FFmpeg a dépassé 60 secondes."
                                )
                            ),
                        60000
                    )
            )

        ]);


        ffmpegLoaded =
            true;


        loading.classList.remove(
            "show"
        );


    } catch (error) {

        console.error(
            "FFmpeg:",
            error
        );

        spinner.style.display =
            "none";

        loadingTitle.textContent =
            "❌ Impossible de charger FFmpeg";

        loadingText.textContent =
            "Le moteur de conversion n'a pas pu être chargé.";

        loadingError.textContent =
            "Vérifie que tu ouvres ton application depuis une adresse HTTPS et que ton iPhone est connecté à Internet.";

        loadingClose.style.display =
            "block";


        throw error;

    }

}


/* =========================================================
   FERMER ERREUR
========================================================= */

loadingClose.addEventListener(
    "click",
    function () {

        loading.classList.remove(
            "show"
        );

    }
);


/* =========================================================
   CONVERTIR UNE VIDÉO
========================================================= */

async function convertOne(video) {

    currentVideo =
        video;

    video.status =
        "processing";

    video.progress =
        0;

    updateCard(video);


    const inputName =
        "input_" +
        video.id;

    const outputName =
        "output_" +
        video.id +
        ".mp3";


    try {

        /*
           Lit le fichier vidéo.
        */

        const buffer =
            await video.file.arrayBuffer();


        /*
           Écrit temporairement la vidéo
           dans la mémoire de FFmpeg.
        */

        await ffmpeg.writeFile(
            inputName,
            new Uint8Array(buffer)
        );


        /*
           Conversion réelle VIDEO → MP3.
        */

        await ffmpeg.exec([

            "-i",
            inputName,

            "-vn",

            "-codec:a",
            "libmp3lame",

            "-q:a",
            "2",

            outputName

        ]);


        /*
           Récupère le MP3.
        */

        const data =
            await ffmpeg.readFile(
                outputName
            );


        video.mp3 =
            new Blob(
                [data.buffer],
                {
                    type:
                        "audio/mpeg"
                }
            );


        video.progress =
            100;

        video.status =
            "done";


        /*
           Nettoyage immédiat.
        */

        try {
            await ffmpeg.deleteFile(
                inputName
            );
        } catch (e) {}

        try {
            await ffmpeg.deleteFile(
                outputName
            );
        } catch (e) {}


    } catch (error) {

        console.error(
            "Conversion:",
            error
        );

        video.status =
            "error";

        video.progress =
            0;

    }


    currentVideo =
        null;

    updateCard(video);

    updateButtons();

}


/* =========================================================
   CONVERTIR TOUTES LES VIDÉOS
========================================================= */

convertButton.addEventListener(
    "click",
    async function () {

        if (!videos.length) {
            return;
        }


        convertButton.disabled =
            true;

        zipBlob =
            null;

        zipStatus.textContent =
            "";


        try {

            /*
               FFmpeg n'est chargé qu'ici.
            */

            await loadFFmpeg();


            /*
               IMPORTANT :

               Une vidéo à la fois.
            */

            for (
                const video of videos
            ) {

                if (
                    video.status !==
                    "waiting"
                ) {
                    continue;
                }

                await convertOne(
                    video
                );

            }


        } catch (error) {

            console.error(
                error
            );

        }


        updateButtons();

    }
);


/* =========================================================
   ZIP
========================================================= */

zipButton.addEventListener(
    "click",
    async function () {

        const completed =
            videos.filter(
                v =>
                    v.status === "done" &&
                    v.mp3
            );


        if (
            !completed.length
        ) {
            return;
        }


        zipButton.disabled =
            true;

        saveButton.disabled =
            true;

        zipStatus.textContent =
            "📦 Création du ZIP...";


        try {

            const zip =
                new JSZip();


            for (
                const video of completed
            ) {

                zip.file(
                    video.outputName,
                    video.mp3
                );

            }


            zipBlob =
                await zip.generateAsync(

                    {
                        type: "blob",

                        compression:
                            "DEFLATE",

                        compressionOptions: {
                            level: 6
                        }

                    },

                    metadata => {

                        zipStatus.textContent =
                            "📦 Création : " +
                            Math.round(
                                metadata.percent
                            ) +
                            " %";

                    }

                );


            zipStatus.textContent =
                "✓ ZIP prêt";

            saveButton.disabled =
                false;


        } catch (error) {

            console.error(
                error
            );

            zipBlob =
                null;

            zipStatus.textContent =
                "⚠️ Erreur lors de la création du ZIP";

        }


        updateButtons();

    }
);


/* =========================================================
   ENREGISTRER
========================================================= */

saveButton.addEventListener(
    "click",
    async function () {

        if (!zipBlob) {
            return;
        }


        const file =
            new File(
                [zipBlob],
                "videos_MP3.zip",
                {
                    type:
                        "application/zip"
                }
            );


        try {

            /*
               Sur iPhone :

               Partager → Enregistrer dans Fichiers
            */

            if (
                navigator.share &&
                navigator.canShare &&
                navigator.canShare({
                    files: [file]
                })
            ) {

                await navigator.share({

                    files: [file],

                    title:
                        "MP3 convertis"

                });

                return;

            }


            /*
               Solution de secours.
            */

            const url =
                URL.createObjectURL(
                    zipBlob
                );

            const a =
                document.createElement(
                    "a"
                );

            a.href =
                url;

            a.download =
                "videos_MP3.zip";

            document.body.appendChild(
                a
            );

            a.click();

            a.remove();


            setTimeout(
                () =>
                    URL.revokeObjectURL(
                        url
                    ),
                5000
            );


        } catch (error) {

            console.log(
                "Partage annulé.",
                error
            );

        }

    }
);


/* =========================================================
   UTILITAIRES
========================================================= */

function getMP3Name(name) {

    const dot =
        name.lastIndexOf(".");

    if (dot === -1) {
        return name + ".mp3";
    }

    return (
        name.substring(
            0,
            dot
        ) +
        ".mp3"
    );

}


function formatBytes(bytes) {

    if (bytes === 0) {
        return "0 octet";
    }

    const units =
        [
            "octets",
            "Ko",
            "Mo",
            "Go"
        ];

    const i =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );

    return (
        (
            bytes /
            Math.pow(
                1024,
                i
            )
        ).toFixed(
            i === 0 ? 0 : 1
        ) +
        " " +
        units[i]
    );

}


function escapeHTML(text) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   DÉMARRAGE
========================================================= */

render();

updateButtons();
